
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Confirmed</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .card {
      text-align: center;
      background: white;
      padding: 40px 25px;
      margin: 20px;
      border-radius: 16px;
      max-width: 360px;
      box-shadow: 0 5px 25px #0000000d;
    }
    .check {
      font-size: 48px;
      color: #16a34a;
    }
    h1 { font-size: 26px; }
    p { color: #64748b; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Email Confirmed!</h1>
    <p>Your email address has been successfully verified.</p>
    <p>You can now return to the app and sign in.</p>
    <p>You may close this page.</p>
  </div>
</body>
</html>
